# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y

# Increase transmit power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase power usage for more range
# CONFIG_BT_CTLR_PHY_2M=n

# Setup battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Setup battery reporting for both sides
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


# Enable deep sleep
CONFIG_ZMK_SLEEP=y


# Enable experimental connection features,
# it's meant to be helpful
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y


# Enable pointing functionality
CONFIG_ZMK_POINTING=y